<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sneha's Diwali | Festival of Lights</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #f5c76a;
  --dark-gold: #b88635;
  --maroon: #3b0718;
  --deep: #160817;
  --cream: #fff1cf;
}

body {
  background: var(--deep);
  color: var(--cream);
  font-family: 'Poppins', sans-serif;
  overflow-x: hidden;
}

html {
  scroll-behavior: smooth;
}

button {
  font-family: inherit;
  cursor: pointer;
}


  /* MAIN BACKGROUND */

body {
  background:
    radial-gradient(circle at top, #541329 0%, #260817 45%, #100510 100%);
  min-height: 100vh;
}

/* GOLDEN PARTICLES */

.particle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: #ffd875;
  border-radius: 50%;
  box-shadow: 0 0 12px #ffca55;
  animation: sparkle 3s infinite alternate;
  pointer-events: none;
  z-index: 1;
}

@keyframes sparkle {
  from {
    opacity: 0.2;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1.5);
  }
}

/* TOP HEADER */

header {
  width: 100%;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-bottom: 1px solid rgba(245,199,106,0.25);
}

.brand {
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  text-align: center;
}

/* HERO SECTION */

.hero {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  position: relative;
  overflow: hidden;
}

.hero h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(32px, 8vw, 65px);
  color: var(--gold);
  line-height: 1.3;
  text-shadow: 0 0 25px rgba(245,199,106,0.4);
}

.hero p {
  font-size: 15px;
  color: #ffe6b3;
  margin-top: 15px;
  line-height: 1.8;
  }
